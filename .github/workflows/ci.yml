name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test-build:
    name: 静态检查 + 单元测试 + Release 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析（error / warning 即失败，info 不拦）
        run: flutter analyze --no-fatal-infos

      - name: 单元测试
        run: flutter test

      # 没有 key.properties 时 gradle 会自动回退到 debug 签名，
      # 所以 CI 里不需要密钥也能验证「release 能打出来」。
      - name: Release 打包（arm64）
        run: flutter build apk --release --target-platform android-arm64

      - name: 校验产物权限与备份开关
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          echo "--- 权限（应为空或仅 AndroidX 内部权限）---"
          "$AAPT" dump permissions "$APK"
          echo "--- allowBackup / dataExtractionRules ---"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -iE "allowBackup|dataExtractionRules" || true
